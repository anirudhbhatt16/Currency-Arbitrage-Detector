<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Backtest — Currency Arbitrage</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f1f5f9;
      --primary: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --nav-h: 68px;
    }

    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    nav { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; z-index: 100; box-shadow: 0 2px 16px rgba(0,0,0,0.05); }
    .nav-brand { display: flex; align-items: center; gap: 0.6rem; font-size: 1.05rem; font-weight: 700; color: var(--primary); text-decoration: none; }
    .nav-brand .brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), #3b82f6); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .nav-brand .brand-icon svg { width: 18px; height: 18px; fill: white; }
    .nav-links { display: flex; align-items: center; gap: 0.25rem; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--muted); font-size: 0.85rem; font-weight: 500; padding: 0.45rem 0.9rem; border-radius: 8px; transition: background 0.18s, color 0.18s; }
    .nav-links a:hover { background: #f1f5f9; color: var(--primary); }
    .nav-links a.active { background: rgba(37,99,235,0.08); color: var(--primary); }
    .nav-links .logout-btn { background: var(--danger); color: white; border-radius: 8px; padding: 0.45rem 1rem; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: background 0.18s; }
    .nav-links .logout-btn:hover { background: #dc2626; color: white; }

    .main { padding-top: calc(var(--nav-h) + 3rem); padding-bottom: 4rem; max-width: 1000px; margin: 0 auto; padding-left: 2rem; padding-right: 2rem; }

    .page-header { margin-bottom: 2rem; animation: fadeDown 0.5s ease both; }
    @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }
    .page-header h2 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; }
    .page-header p { color: var(--muted); font-size: 0.88rem; margin-top: 0.25rem; }

    .back-btn { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--primary); font-size: 0.85rem; font-weight: 500; text-decoration: none; margin-bottom: 1.5rem; padding: 0.4rem 0.8rem; border-radius: 8px; background: rgba(37,99,235,0.06); transition: background 0.18s; }
    .back-btn:hover { background: rgba(37,99,235,0.12); }

    .toolbar {
      display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem;
      animation: fadeUp 0.5s ease 0.1s both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

    .btn {
      padding: 0.7rem 1.4rem; border: none; border-radius: 10px;
      font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(37,99,235,0.4); }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 0.4rem; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .run-status { font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; }

    .table-card {
      background: var(--card); border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      overflow: hidden;
      animation: fadeUp 0.5s ease 0.2s both;
    }

    .table-card table {
      width: 100%; border-collapse: collapse;
    }

    thead tr {
      background: #f8fafc;
      border-bottom: 2px solid var(--border);
    }

    th {
      padding: 1rem 1.25rem;
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); text-align: left;
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    tbody tr:nth-child(even) { background: #fbfcfd; }
    tbody tr:nth-child(even):hover { background: #f3f6fb; }

    td {
      padding: 0.9rem 1.25rem;
      font-size: 0.85rem;
      color: var(--text);
    }

    td.date { font-weight: 500; color: var(--muted); font-size: 0.82rem; }

    .badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.25rem 0.7rem; border-radius: 20px;
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .badge.yes { background: rgba(16,185,129,0.1); color: var(--success); }
    .badge.no  { background: rgba(239,68,68,0.1);  color: var(--danger);  }

    .profit-cell { font-weight: 700; }
    .profit-pos { color: var(--success); }
    .profit-neg { color: var(--danger); }

    .cycle-cell { font-size: 0.8rem; color: var(--muted); }

    .table-footer {
      padding: 1rem 1.25rem;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-chips { display: flex; gap: 0.75rem; }
    .chip { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.25rem 0.7rem; font-size: 0.78rem; font-weight: 600; color: var(--text); }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="dashboard.html">
      <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg></div>
      Currency Arbitrage System
    </a>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="backtest.html" class="active">Backtest</a></li>
      <li><a href="performance.html">Performance</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a class="logout-btn" id="logoutBtn" href="#">Logout</a></li>
    </ul>
  </nav>

  <main class="main">
    <a class="back-btn" href="dashboard.html">← Back to Dashboard</a>

    <div class="page-header">
      <h2>📋 Backtest History</h2>
      <p>Historical arbitrage signal log — 30 days of detected opportunities.</p>
    </div>

    <div class="toolbar">
      <button class="btn btn-primary" id="runBacktest">▶ Run Backtest</button>
      <div class="run-status" id="runStatus"></div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Cycle</th>
            <th>Arbitrage</th>
            <th>Profit %</th>
          </tr>
        </thead>
        <tbody id="btBody"></tbody>
      </table>
      <div class="table-footer">
        <div id="rowCount">Showing 0 records</div>
        <div class="summary-chips">
          <div class="chip" id="chipYes">YES: 0</div>
          <div class="chip" id="chipNo">NO: 0</div>
          <div class="chip" id="chipAvg">Avg: 0%</div>
        </div>
      </div>
    </div>
  </main>

  <script src="backtest.js"></script>
</body>
</html>
